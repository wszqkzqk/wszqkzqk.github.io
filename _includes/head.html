<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="google-site-verification" content="xBT4GhYoi5qRD5tr338pgPM5OWHHIDR6mNg1a3euekI" />
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description }}">
    <meta name="keywords"  content="{{ site.keyword }}">
    <meta name="theme-color" content="{{ site.chrome-tab-theme-color }}">

    <title>{% if page.title %}{{ page.title }} - {{ site.SEOTitle }}{% else %}{{ site.SEOTitle }}{% endif %}</title>

    <link rel="manifest" href="{{ site.baseurl }}/pwa/manifest.json">
    <link rel="shortcut icon" href="{{ site.baseurl }}/img/favicon.ico">
    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site.baseurl | prepend: site.url }}">

    <link rel="stylesheet" href="{{ "/css/bootstrap.min.css" | prepend: site.baseurl }}">
    <link rel="stylesheet" href="{{ "/css/wszqkzqk-blog.min.css" | prepend: site.baseurl }}">
    <link rel="stylesheet" href="{{ "/css/syntax.css" | prepend: site.baseurl }}">
    <link href="//cdnjs.cloudflare.com/ajax/libs/font-awesome/4.6.3/css/font-awesome.min.css" rel="stylesheet">

    <script>
        window.MathJax = {
            tex: {
            skipTags: ['script', 'noscript', 'style', 'textarea', 'pre'],
            inlineMath: [['$','$']],
            packages: {'[+]': ['mhchem']}
            },
            loader: {load: ['[tex]/mhchem']},
        };
    </script>
    <script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4/tex-mml-chtml.js"></script>

    <style>
        mjx-container[display="true"] {
            overflow-x: auto;
            overflow-y: hidden;
            max-width: 100%;
            display: block !important;
        }

        .MathJax_Display,
        mjx-container[jax="CHTML"][display="true"] {
            overflow-x: auto;
            overflow-y: hidden;
            max-width: 100%;
        }

        mjx-container[display="true"]::-webkit-scrollbar {
            height: 8px;
        }

        mjx-container[display="true"]::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }

        mjx-container[display="true"]::-webkit-scrollbar-thumb {
            background: #888;
            border-radius: 4px;
        }

        mjx-container[display="true"]::-webkit-scrollbar-thumb:hover {
            background: #555;
        }
    </style>
</head>
